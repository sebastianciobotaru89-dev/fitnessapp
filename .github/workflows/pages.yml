name: Publicare pe GitHub Pages

# Publishes the app on every push to main, whoever pushes.
# Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verific că nu sunt chei în fișiere
        run: node tools/check-secrets.mjs --all
      - name: Pregătesc doar fișierele aplicației
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest .nojekyll css js fonts icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
