name: Verificare secrete

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Caut chei API în fișiere și în tot istoricul
        run: |
          node tools/check-secrets.mjs --all
          node tools/check-secrets.mjs --history
