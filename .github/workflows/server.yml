# The server: the shared product database (Supabase). Tested on every change; published only when the secrets exist.
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project's id (the xxxx in xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was made
#   PORTIA_PEPPER          a long random string; it makes the install and network hashes one-way
name: Server – teste și publicare

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: teste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Baza de date – migrare de două ori și teste
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
          for pass in 1 2; do for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/shared_products.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Funcția products – teste
        run: deno test supabase/functions/products/handler_test.ts

  deploy:
    name: publicare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PORTIA_PEPPER: ${{ secrets.PORTIA_PEPPER }}
    steps:
      - name: Sunt setate secretele?
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PORTIA_PEPPER" ]; then
            echo "::notice::Serverul nu e configurat încă. Adaugă SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD și PORTIA_PEPPER în secretele GitHub."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "${#PORTIA_PEPPER}" -lt 32 ]; then
            echo "::error::PORTIA_PEPPER trebuie să aibă cel puțin 32 de caractere."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest
      - name: Baza de date, secretul funcției și funcția
        if: steps.ready.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
          umask 077
          printf 'PORTIA_PEPPER=%s\n' "$PORTIA_PEPPER" > "$RUNNER_TEMP/fn.env"
          supabase secrets set --env-file "$RUNNER_TEMP/fn.env" --project-ref "$PROJECT_REF"
          rm -f "$RUNNER_TEMP/fn.env"
          supabase functions deploy products --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verificare după publicare
        if: steps.ready.outputs.ok == 'true'
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/products"
          body=$(curl -sS --retry 3 --retry-delay 5 "$url?code=5901234123457")
          echo "$body" | grep -Eq '"status":"(none|pending|verified)"' || { echo "::error::Funcția nu răspunde corect: $body"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url?code=123")
          [ "$code" = "400" ] || { echo "::error::Un cod greșit trebuia refuzat (400), a venit $code"; exit 1; }
          rest=$(curl -s -o /dev/null -w '%{http_code}' "https://$PROJECT_REF.supabase.co/rest/v1/shared_products?select=code&limit=1")
          [ "$rest" != "200" ] || { echo "::error::Tabelele se pot citi direct, fără funcție"; exit 1; }
          echo "::notice::Serverul răspunde: $url"
